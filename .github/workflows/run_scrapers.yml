name: Scrape Leek Duck Data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: leak-duck-data-publisher
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Configure data directory
        run: echo "DATA_DIR=$RUNNER_TEMP/data" >> "$GITHUB_ENV"

      - name: Check out main branch for code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -v

      - name: Check out data branch
        run: |
          git fetch --depth=1 origin data
          git worktree add --detach "$DATA_DIR" FETCH_HEAD

      - name: Run archiver and scrapers
        env:
          LEAK_DUCK_PUBLISHED_DIR: ${{ env.DATA_DIR }}
          LEAK_DUCK_OUTPUT_DIR: ${{ env.DATA_DIR }}
        run: python -m src.main

      - name: Commit and push data branch
        working-directory: ${{ env.DATA_DIR }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp "$GITHUB_WORKSPACE/.github/data-branch-readme.md" README.md
          git add -A

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Automated data update"
            git push origin HEAD:refs/heads/data
          fi
