name: Deploy API Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy_pages.yml"
  workflow_run:
    workflows: ["Scrape Leek Duck Data", "Backfill Event Archives"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A failed scrape still publishes the files that succeeded, so only runs
    # that were cancelled are skipped.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out main branch for the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Assemble site from data branch and site sources
        run: |
          git fetch --depth=1 origin data
          mkdir -p _site
          git archive FETCH_HEAD | tar -x -C _site
          cp -R site/. _site/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
