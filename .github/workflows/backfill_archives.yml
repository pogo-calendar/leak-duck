name: Backfill Event Archives

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Archive years to rebuild (space separated, e.g. 2025 2026)"
        required: true
        default: "2025 2026"
      dry_run:
        description: "Report changes without publishing them"
        type: boolean
        default: true

concurrency:
  group: leak-duck-data-publisher
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Configure data directory
        run: echo "DATA_DIR=$RUNNER_TEMP/data" >> "$GITHUB_ENV"

      - name: Check out main branch for code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -v

      - name: Check out data branch
        run: |
          git fetch --depth=1 origin data
          git worktree add --detach "$DATA_DIR" FETCH_HEAD

      - name: Rebuild archives from their source pages
        env:
          LEAK_DUCK_PUBLISHED_DIR: ${{ env.DATA_DIR }}
          LEAK_DUCK_OUTPUT_DIR: ${{ env.DATA_DIR }}
          YEARS: ${{ inputs.years }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        # YEARS is intentionally unquoted so each year becomes its own argument.
        run: python -m src.backfill $YEARS $DRY_RUN

      - name: Commit and push rebuilt archives to data branch
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ env.DATA_DIR }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -- archives/ manifest.json

          if git diff --cached --quiet; then
            echo "Archives are already up to date"
          else
            git commit -m "Rebuild event archives from source pages"
            git push origin HEAD:refs/heads/data
          fi
